name: Main workflow

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 13 * * 1" # Every Monday at 1PM UTC
    # https://jasonet.co/posts/scheduled-actions/

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - "5.4"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # wasm_of_ocaml needs Binaryen 120 or later
      - name: Set-up Binaryen
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}

      # Both applications are packages named graffiti: install their
      # dependencies one at a time.
      - name: Install the dependencies of simple
        run: opam install ./simple --deps-only -y

      - name: Install the dependencies of extended
        run: opam install ./extended --deps-only -y

      - name: Compiling simple
        working-directory: simple
        run: opam exec -- dune build

      - name: Compiling extended
        working-directory: extended
        run: opam exec -- dune build
